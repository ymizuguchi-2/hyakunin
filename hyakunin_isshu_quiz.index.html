<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>百人一首クイズ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2em;
    }
    .card {
      border: 1px solid #ccc;
      padding: 1em;
      margin: 1em auto;
      width: 80%;
      max-width: 600px;
      border-radius: 10px;
      box-shadow: 2px 2px 5px #aaa;
    }
    button {
      margin: 0.5em;
      padding: 0.5em 1em;
      font-size: 1em;
    }
    #score {
      font-weight: bold;
      margin-bottom: 1em;
    }
    #history {
      margin-top: 2em;
      text-align: left;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    #history ul {
      padding-left: 1em;
    }
  </style>
</head>
<body>
  <h1>百人一首クイズ</h1>
  <div class="card">
    <div id="score">スコア：0 / 0</div>
    <h2 id="kami">上の句がここに表示されます</h2>
    <div id="choices"></div>
    <p id="result"></p>
    <button onclick="nextQuestion()">次の問題</button>
  </div>
  <div id="history">
    <h3>履歴</h3>
    <ul id="historyList"></ul>
  </div>

  <script>
        const fullPoems = [
  ["秋の田の かりほの庵の 苫をあらみ", "わが衣手は 露にぬれつつ"],
      ["春過ぎて 夏来にけらし 白妙の", "衣ほすてふ 天の香具山"],
      ["あしびきの 山鳥の尾の しだり尾の", "ながながし夜を ひとりかも寝む"],
      ["田子の浦に うち出でて見れば 白妙の", "富士の高嶺に 雪は降りつつ"],
      ["奥山に 紅葉踏み分け 鳴く鹿の", "声聞く時ぞ 秋は悲しき"],
      ["かささぎの 渡せる橋に おく霜の", "白きを見れば 夜ぞふけにける"],
      ["天の原 ふりさけ見れば 春日なる", "三笠の山に 出でし月かも"],
      ["わが庵は 都のたつみ しかぞ住む", "世をうぢ山と 人はいふなり"],
      ["花の色は 移りにけりな いたづらに", "わが身世にふる ながめせしまに"],
      ["これやこの 行くも帰るも 別れては", "知るも知らぬも 逢坂の関"],
      ["わたの原 八十島かけて 漕ぎ出でぬと", "人には告げよ あまのつり舟"],
      ["天つ風 雲のかよひ路 吹きとぢよ", "をとめの姿 しばしとどめむ"],
      ["筑波嶺の 峰より落つる みなの川", "恋ぞつもりて 淵となりぬる"],
      ["陸奥の しのぶもぢずり 誰ゆゑに", "乱れそめにし 我ならなくに"],
      ["君がため 春の野に出でて 若菜つむ", "わが衣手に 雪は降りつつ"],
      ["立ち別れ いなばの山の 峰に生ふる", "まつとし聞かば 今帰り来む"],
      ["ちはやぶる 神代も聞かず 竜田川", "からくれなゐに 水くくるとは"],
      ["住の江の 岸による波 よるさへや", "夢の通ひ路 人目よくらむ"],
      ["難波潟 短き蘆の ふしの間も", "逢はでこの世を 過ぐしてよとや"],
      ["わびぬれば 今はた同じ 難波なる", "みをつくしても 逢はむとぞ思ふ"],
      ["今来むと いひしばかりに 長月の", "有明の月を 待ち出でつるかな"],
      ["吹くからに 秋の草木の しをるれば", "むべ山風を 嵐といふらむ"],
      ["月見れば ちぢにものこそ かなしけれ", "わが身ひとつの 秋にはあらねど"],
      ["このたびは 幣も取りあへず 手向山", "もみぢのにしき 神のまにまに"],
      ["名にし負はば いざ言問はむ 都鳥", "わが思ふ人は ありやなしやと"],
      ["小倉山 峰のもみぢ葉 心あらば", "今ひとたびの みゆき待たなむ"],
      ["みかの原 わきて流るる いづみ川", "いつ見きとてか 恋しかるらむ"],
      ["山里は 冬ぞさびしさ まさりける", "人目も草も かれぬと思へば"],
      ["心あてに 折らばや折らむ 初霜の", "おきまどはせる 白菊の花"],
      ["有明の つれなく見えし 別れより", "暁ばかり 憂きものはなし"],
      ["朝ぼらけ 有明の月と 見るまでに", "吉野の里に 降れる白雪"],
      ["山川に 風のかけたる しがらみは", "流れもあへぬ 紅葉なりけり"],
      ["ひさかたの 光のどけき 春の日に", "しづ心なく 花の散るらむ"],
      ["誰をかも 知る人にせむ 高砂の", "松も昔の 友ならなくに"],
      ["人はいさ 心も知らず ふるさとは", "花ぞ昔の 香ににほひける"],
      ["夏の夜は まだ宵ながら 明けぬるを", "雲のいづこに 月宿るらむ"],
      ["白露に 風の吹きしく 秋の野は", "つらぬきとめぬ 玉ぞ散りける"],
      ["忘らるる 身をば思はず 誓ひてし", "人の命の 惜しくもあるかな"],
      ["浅茅生の 小野の篠原 忍ぶれど", "あまりてなどか 人の恋しき"],
      ["しのぶれど 色に出でにけり 我が恋は", "ものや思ふと 人の問ふまで"],
      ["恋すてふ わが名はまだき 立ちにけり", "人知れずこそ 思ひそめしか"],
      ["契りきな かたみに袖を しぼりつつ", "末の松山 波越さじとは"],
      ["逢ひ見ての 後の心に くらぶれば", "昔はものを 思はざりけり"],
      ["逢ふことの 絶えてしなくは なかなかに", "人をも身をも 恨みざらまし"],
      ["あはれとも いふべき人は 思ほえで", "身のいたづらに なりぬべきかな"],
      ["由良のとを 渡る舟人 かぢを絶え", "ゆくへも知らぬ 恋の道かな"],
      ["八重むぐら しげれる宿の さびしきに", "人こそ見えね 秋は来にけり"],
      ["風をいたみ 岩うつ波の おのれのみ", "くだけてものを 思ふころかな"],
      ["みかきもり 衛士のたく火の 夜はもえ", "昼は消えつつ ものをこそ思へ"],
      ["かくとだに えやは伊吹の さしも草", "さしも知らじな 燃ゆる思ひを"],
      ["明けぬれば 暮るるものとは 知りながら", "なほ恨めしき 朝ぼらけかな"],
      ["嘆きつつ ひとり寝る夜の 明くる間は", "いかに久しき ものとかは知る"],
      ["忘れじの 行く末までは 難ければ", "今日を限りの 命ともがな"],
      ["滝の音は 絶えて久しく なりぬれど", "名こそ流れて なほ聞こえけれ"],
      ["あらざらむ この世のほかの 思ひ出に", "今ひとたびの 逢ふこともがな"],
      ["めぐり逢ひて 見しやそれとも 分かぬ間に", "雲隠れにし 夜半の月かな"],
      ["有馬山 猪名の笹原 風吹けば", "いでそよ人を 忘れやはする"],
      ["やすらはで 寝なましものを さ夜更けて", "かたぶくまでの 月を見しかな"],
      ["大江山 いく野の道の 遠ければ", "まだふみも見ず 天の橋立"],
      ["いにしへの 奈良の都の 八重桜", "けふ九重に 匂ひぬるかな"],
      ["夜をこめて 鳥のそら音は はかるとも", "よに逢坂の 関は許さじ"],
      ["今はただ 思ひ絶えなむ とばかりを", "人づてならで 言ふよしもがな"],
      ["朝ぼらけ 宇治の川霧 絶え絶えに", "あらはれわたる 瀬々の網代木"],
      ["恨みわび ほさぬ袖だに あるものを", "恋に朽ちなむ 名こそ惜しけれ"],
      ["もろともに あはれと思へ 山桜", "花よりほかに 知る人もなし"],
      ["春の夜の 夢ばかりなる 手枕に", "かひなく立たむ 名こそ惜しけれ"],
      ["心にも あらで憂き夜に ながらへば", "恋しかるべき 夜半の月かな"],
      ["あらし吹く 三室の山の もみぢ葉は", "竜田の川の 錦なりけり"],
      ["さびしさに 宿を立ち出でて ながむれば", "いづくも同じ 秋の夕暮れ"],
      ["夕されば 門田の稲葉 おとづれて", "あしのまろやに 秋風ぞ吹く"],
      ["音に聞く 高師の浜の あだ波は", "かけじや袖の ぬれもこそすれ"],
      ["高砂の 尾の上の桜 咲きにけり", "外山の霞 立たずもあらなむ"],
      ["憂かりける 人を初瀬の 山おろしよ", "激しかれとは 祈らぬものを"],
      ["契りおきし させもが露を 命にて", "あはれ今年の 秋もいぬめり"],
      ["我が袖は 潮干に見えぬ 沖の石の", "人こそ知らね 乾く間もなし"],
      ["世の中よ 道こそなけれ 思ひ入る", "山の奥にも 鹿ぞ鳴くなる"],
      ["長らへば またこのごろや しのばれむ", "憂しと見し世ぞ 今は恋しき"],
      ["夜もすがら 物思ふころは 明けやらぬ", "ねやのひまさへ つれなかりけり"],
      ["歎けとて 月やはものを 思はする", "かこち顔なる 我が涙かな"],
      ["村雨の 露もまだひぬ 槇の葉に", "霧立ちのぼる 秋の夕暮れ"],
      ["難波江の 芦のかりねの ひとよゆゑ", "身を尽くしてや 恋ひわたるべき"],
      ["玉の緒よ 絶えなば絶えね ながらへば", "忍ぶることの 弱りもぞする"],
      ["見せばやな 雄島のあまの 袖だにも", "ぬれにぞぬれし 色は変はらず"],
      ["きりぎりす 鳴くや霜夜の さむしろに", "衣かたしき ひとりかも寝む"],
      ["わが袖は ほしひしほに見えぬ 沖の石の", "人こそ知らね 乾く間もなし"],
      ["世の中は 常にもがもな 渚こぐ", "あまの小舟の 綱手かなしも"],
      ["み吉野の 山の秋風 さ夜ふけて", "ふるさと寒く 衣うつなり"],
      ["おほけなく 憂き世の民に おほふかな", "わが立つ杣に 墨染の袖"],
      ["花の色は 移りにけりな いたづらに", "わが身世にふる ながめせしまに"],
      ["春過ぎて 夏来にけらし 白妙の", "衣ほすてふ 天の香具山"],
      ["ひともをし ひともうらめし あぢきなく", "世を思ふゆゑに もの思ふ身は"],
      ["ももしきや 古き軒端の しのぶにも", "なほあまりある 昔なりけり"]
    ];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    const quizData = fullPoems.map(([kami, shimo], index, arr) => {
      const otherShimos = arr.filter(([_, s]) => s !== shimo).map(([_, s]) => s);
      const choices = shuffle([shimo, ...shuffle(otherShimos).slice(0, 2)]);
      return { kami, shimo, choices };
    });

    let currentIndex = 0;
    let score = 0;
    let total = 0;
    let questions = [];

    function startQuiz() {
      questions = shuffle([...quizData]);
      currentIndex = 0;
      score = 0;
      total = 0;
      document.getElementById("historyList").innerHTML = "";
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentIndex];
      const otherShimos = fullPoems.filter(([_, s]) => s !== q.shimo).map(([_, s]) => s);
      q.choices = shuffle([q.shimo, ...shuffle(otherShimos).slice(0, 2)]);

      document.getElementById("kami").textContent = q.kami;
      const choicesDiv = document.getElementById("choices");
      choicesDiv.innerHTML = "";
      q.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(choice, q);
        choicesDiv.appendChild(btn);
      });
      document.getElementById("result").textContent = "";
      updateScore();
    }

    function checkAnswer(selected, q) {
      const result = document.getElementById("result");
      total++;
      const correct = q.shimo;
      const isCorrect = selected === correct;
      if (isCorrect) {
        result.textContent = "正解！";
        result.style.color = "green";
        score++;
      } else {
        result.textContent = "不正解… 正解は：" + correct;
        result.style.color = "red";
      }
      updateScore();
      addToHistory(q.kami, selected, correct, isCorrect);
    }

    function updateScore() {
      document.getElementById("score").textContent = `スコア：${score} / ${total}`;
    }

    function addToHistory(kami, selected, correct, isCorrect) {
      const li = document.createElement("li");
      li.innerHTML = `<strong>${isCorrect ? '○' : '×'}</strong> 上の句：「${kami}」<br>あなたの答え：「${selected}」<br>正解：「${correct}」`;
      document.getElementById("historyList").prepend(li);
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % questions.length;
      showQuestion();
    }

    startQuiz();
  </script>
</body>
</html>
